name: Check Mostaql Projects

on:
  schedule:
    # Triggers every 5 minutes (fastest native GitHub cron interval)
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: mostaql-monitor
  cancel-in-progress: false

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Preserves seen_projects.db across runs to prevent duplicate emails
      - name: Cache Seen Projects Database
        uses: actions/cache@v4
        with:
          path: seen_projects.db
          key: mostaql-db-${{ github.run_id }}
          restore-keys: |
            mostaql-db-

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Scraper Every Minute
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          # Loops 4 times with a 60-second delay between checks
          for i in {1..4}; do
            echo "--- Iteration $i of 4 (1-minute interval) ---"
            python monitor.py
            if [ $i -lt 4 ]; then
              sleep 60
            fi
          done
          
